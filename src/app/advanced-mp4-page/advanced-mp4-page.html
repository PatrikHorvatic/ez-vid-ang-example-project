<div class="page">
	<a class="back-link" routerLink="/">← Back</a>

	<h1 class="page-title">Advanced Player — MP4 + Subtitles</h1>
	<p class="page-subtitle">
		Chapters, subtitles, settings panel, keyboard shortcuts, context menu, and persisted
		preferences — everything a non-streaming player needs.
	</p>

	<div class="stage">
		<eva-player #evaVideoPlayer id="advanced-mp4" [evaVideoSources]="videoSources()"
			[evaVideoTracks]="videoTracks()" [evaKeyboardShortcutsEnabled]="true"
			[evaLocalStorageEnabled]="true" [evaLocalStorageKey]="'ADVANCED_MP4_PLAYER'"
			[evaLocalStorageConfiguration]="{ volume: true, playbackSpeed: true, cinemaMode: true, loop: true }">

			<eva-overlay-play />
			<eva-error-overlay (evaRetryClicked)="onRetry()" />
			<eva-keyboard-shortcuts-overlay />
			<eva-ended-overlay>
				<button type="button" class="replay-btn" (click)="replay()">↺ Replay</button>
			</eva-ended-overlay>

			<eva-buffering />

			<eva-context-menu [evaMenuItems]="contextMenuItems" (evaMenuItemClicked)="onContextMenuAction($event)" />

			<eva-scrub-bar [evaShowTimeOnHover]="true" [evaShowChapters]="true" [evaChapters]="chapters()"
				[evaThumbnailVtt]="'thumbnails.vtt'" [hideWithControlsContainer]="true">
				<eva-scrub-bar-buffering-time />
				<eva-scrub-bar-current-time />
			</eva-scrub-bar>

			<eva-subtitle-display />

			<eva-chapter-list [evaChapterListOpen]="isChapterListOpen()" (evaChapterListClose)="isChapterListOpen.set(false)" />

			<eva-controls-container evaUserInteractionEvents [evaAutohide]="true">
				<eva-play-pause evaTooltip evaTooltipShortcutKey="playPause" />
				<eva-backward evaTooltip evaTooltipShortcutKey="backwardsKeyOne" />
				<eva-forward evaTooltip evaTooltipShortcutKey="forwardKeyOne" />
				<eva-loop evaTooltip />
				<eva-picture-in-picture evaTooltip />

				<eva-active-chapter evaTooltip (evaChapterClicked)="toggleChapterList()" />

				<eva-mute evaTooltip evaTooltipShortcutKey="muteKey" />
				<eva-volume evaTooltip />

				<eva-time-display evaTimeProperty="current" evaTimeFormating="HH:mm:ss" />
				<eva-remote-playback />

				<eva-controls-divider />

				<eva-time-display evaTimeProperty="remaining" evaTimeFormating="HH:mm:ss" />

				<eva-cinema-mode evaTooltip />
				<eva-download evaTooltip (evaDownloadClicked)="onDownload($event)" />
				<eva-screenshot evaTooltip (evaScreenshotCaptured)="onScreenshot($event)" />
				<eva-track-selector evaTooltip evaTrackSelectorText="Subtitles" />
				<eva-playback-speed evaTooltip [evaPlaybackSpeeds]="[0.5, 1, 1.5, 2]" />
				<eva-settings-panel evaTooltip [evaSettingsMenuItems]="settingsItems()"
					(evaSettingsMenuItemSelected)="onSettingChanged($event)" />
				<eva-fullscreen evaTooltip evaTooltipShortcutKey="fullscreen" />
			</eva-controls-container>
		</eva-player>
	</div>
</div>
