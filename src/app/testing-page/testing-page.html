<eva-player #evaVideoPlayer [id]="'vid'" [evaVideoSources]="[]" [evaVideoConfiguration]="videoConfiguration()"
	[evaKeyboardShortcutsEnabled]="true" [evaKeyboardShortcutsConfiguration]="keyboardConfig()"
	[evaVideoTracks]="videoTracks()" [evaLocalStorageEnabled]="true" [evaLocalStorageKey]="'MY_PLAYER'"
	[evaLocalStorageConfiguration]="{ volume: true, playbackSpeed: true, cinemaMode: true, loop: true }" evaHls
	[evaHlsSrc]="hlsSource()">
	<!-- Overlays -->
	<eva-overlay-play />
	<eva-error-overlay (evaRetryClicked)="onRetry()" />
	<eva-keyboard-shortcuts-overlay />
	<eva-cinema-mode />

	<!-- Buffering indicator -->
	<eva-buffering />

	<!-- Context menu (right-click) -->
	<eva-context-menu [evaMenuItems]="contextMenuItems" (evaMenuItemClicked)="onContextMenuAction($event)" />

	<!-- Scrub bar with chapters -->
	<eva-scrub-bar [evaShowTimeOnHover]="true" [evaShowChapters]="true" [evaChapters]="chapters()"
		[evaThumbnailVtt]="vttFile()" [hideWithControlsContainer]="true">
		<eva-scrub-bar-buffering-time />
		<eva-scrub-bar-current-time />
	</eva-scrub-bar>

	<!-- Subtitles -->
	<eva-subtitle-display />

	<!-- Chapter list panel -->
	<eva-chapter-list [evaChapterListOpen]="isChapterListOpen()" (evaChapterListClose)="isChapterListOpen.set(false)" />

	<!-- Controls bar -->
	<eva-controls-container evaUserInteractionEvents [evaAutohide]="true">
		<eva-play-pause />
		<eva-backward />
		<eva-forward />
		<eva-loop />
		<eva-picture-in-picture />

		<eva-active-chapter (evaChapterClicked)="toggleChapterList()" />

		<eva-mute />
		<eva-volume />

		<eva-time-display evaTimeProperty="current" evaTimeFormating="HH:mm:ss" />
		<eva-remote-playback />

		<eva-controls-divider />

		<eva-time-display evaTimeProperty="remaining" evaTimeFormating="HH:mm:ss" />

		<eva-download (evaDownloadClicked)="onDownload($event)" />
		<eva-screenshot (evaScreenshotCaptured)="onScreenshot($event)" />
		<eva-track-selector />
		<eva-playback-speed [evaPlaybackSpeeds]="[0.25, 0.5, 1, 1.5, 2, 4]" />
		<eva-quality-selector />
		<eva-settings-panel [evaSettingsMenuItems]="settingsItems()"
			(evaSettingsMenuItemSelected)="onSettingChanged($event)" />
		<eva-fullscreen />
	</eva-controls-container>
</eva-player>
